<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actividad 21 — Productos</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>
<body>
<main>
  <h1>Productos</h1>
  <section aria-labelledby="titulo-formulario">
    <h2 id="titulo-formulario">Agregar producto</h2>
    <form id="formulario">
      <label>Nombre<input name="nombre" maxlength="100" required></label>
      <label>Categoría<input name="categoria" maxlength="50" required></label>
      <label>Precio<input name="precio" type="number" min="0" max="99999999.99" step="0.01" required></label>
      <label>Stock<input name="stock" type="number" min="0" max="2147483647" step="1" value="0" required></label>
      <button id="guardar" type="submit" disabled>Guardar producto</button>
    </form>
  </section>
  <p id="mensaje" role="status" aria-live="polite"></p>
  <section aria-labelledby="titulo-listado">
    <h2 id="titulo-listado">Listado de productos</h2>
    <div class="tabla">
      <table>
        <thead><tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th></tr></thead>
        <tbody id="productos"></tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
